name: Chinese integration final verification

on:
  push:
    branches: [codex/chinese-i18n-final-validation]

permissions:
  contents: read

jobs:
  publish-candidate:
    if: github.repository == 'MJYKIM99/codex-router'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: workbench
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: a5ba65c7f1086688212471b570d3beb5556ac11d
          fetch-depth: 0
          path: source
      - name: Reproduce and verify the responsive summary correction
        id: publish
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config core.hooksPath /dev/null
          python3 ../workbench/.github/i18n-final/responsive.py
          git add -A
          test "$(git write-tree)" = 45a73053946b88b210d6f1bc64f61835a8957f42
          cat > "$RUNNER_TEMP/reviewed.commit" <<'COMMIT'
          tree 45a73053946b88b210d6f1bc64f61835a8957f42
          parent a5ba65c7f1086688212471b570d3beb5556ac11d
          author Kim Ma <141823112+MJYKIM99@users.noreply.github.com> 1790023943 +0000
          committer Kim Ma <141823112+MJYKIM99@users.noreply.github.com> 1790023943 +0000

          fix(ui): let summary variants obey responsive breakpoints

          The account-specific class selectors outranked the three-column media rule, leaving seven cramped cells at the 960px minimum window. Lower only the default variant specificity, preserve the existing responsive design, and give wrapped cache values sufficient line height on Windows. Assert both grid columns and unclipped metrics in real browser tests.
          COMMIT
          target=$(git hash-object -t commit -w "$RUNNER_TEMP/reviewed.commit")
          test "$target" = e97b82295a02323b8c90fbcc71a68a0a54e7c397
          for parent in bf55dec27702e678730e27b9b3597eb4b1c74539 f0811d80c18a7d33324ce74d468a76ac6180c5d3 d795cb9bad4a6dbc08662b6608cadbcc8f312f00 70f9b2a096e5c19d502c088ec5c0247308c8372d; do
            git merge-base --is-ancestor "$parent" "$target"
          done
          git diff --exit-code bf55dec27702e678730e27b9b3597eb4b1c74539 "$target" -- .github package.json package-lock.json apps/control-center/package.json apps/control-center/package-lock.json
          git diff --check bf55dec27702e678730e27b9b3597eb4b1c74539 "$target"
          git push origin "$target:refs/heads/codex/chinese-i18n-candidate-v2"
          echo "sha=$target" >> "$GITHUB_OUTPUT"
          printf 'Candidate %s; tree %s; upstream bf55dec\n' "$target" "$(git rev-parse "$target^{tree}")" >> "$GITHUB_STEP_SUMMARY"

  root:
    needs: publish-candidate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish-candidate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - run: npx playwright install chromium
        if: runner.os != 'Linux'
      - name: Root syntax and complete test suite (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm test 2>&1 | tee root-tests.log
      - name: Root syntax and complete test suite (Windows native shell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test 2>&1 | Tee-Object -FilePath root-tests.log
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: root-${{ matrix.os }}
          path: root-tests.log
          retention-days: 7

  renderer:
    needs: publish-candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CODEX_ROUTER_UI_ARTIFACTS: ${{ github.workspace }}/ui-evidence
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish-candidate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/control-center/package-lock.json
      - run: npm ci
      - run: npm --prefix apps/control-center ci
      - run: npx playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - run: npx playwright install chromium
        if: runner.os != 'Linux'
      - name: Typecheck and compiled-renderer tests
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix apps/control-center run check
          npm --prefix apps/control-center test 2>&1 | tee renderer-tests.log
      - name: Build unpacked native application
        working-directory: apps/control-center
        run: npx --no-install electron-builder --${{ matrix.platform }} --dir
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: renderer-${{ matrix.os }}
          path: |
            renderer-tests.log
            ui-evidence/
          retention-days: 7

  native:
    needs: publish-candidate
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      MODEL_ROUTER_TRAY_UNIVERSAL: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish-candidate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Swift tray tests
        shell: bash
        run: |
          set -euo pipefail
          (cd apps/macos/ModelRouterTray && swift test) 2>&1 | tee swift-tests.log
      - name: Widget tests
        shell: bash
        run: |
          set -euo pipefail
          (cd apps/macos/RouterUsageWidget && xcodebuild -project RouterUsageWidget.xcodeproj -scheme RouterUsageWidget -destination 'platform=macOS' test CODE_SIGNING_ALLOWED=NO) 2>&1 | tee widget-tests.log
      - name: Universal unified application and bundle integrity
        shell: bash
        run: |
          set -euo pipefail
          scripts/build-macos-tray-app.sh "$RUNNER_TEMP/Codex Router.app" 2>&1 | tee native-build.log
          app="$RUNNER_TEMP/Codex Router.app"
          lipo "$app/Contents/MacOS/ModelRouterTray" -verify_arch x86_64 arm64
          lipo "$app/Contents/PlugIns/RouterUsageWidget.appex/Contents/MacOS/RouterUsageWidget" -verify_arch x86_64 arm64
          lipo "$app/Contents/Resources/Control Center.app/Contents/MacOS/Codex Router" -verify_arch x86_64 arm64
          codesign --verify --deep --strict "$app"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-macos
          path: |
            swift-tests.log
            widget-tests.log
            native-build.log
          retention-days: 7
