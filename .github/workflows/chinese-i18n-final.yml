name: Chinese integration final verification

on:
  push:
    branches: [codex/chinese-i18n-final-validation]

permissions:
  contents: read

jobs:
  publish-candidate:
    if: github.repository == 'MJYKIM99/codex-router'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: workbench
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 95d2b27289f3056bc1d754a3ad1bad8ccdfefd14
          fetch-depth: 0
          path: source
      - name: Reproduce the reviewed correction and verify its exact tree
        id: publish
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config core.hooksPath /dev/null
          python3 ../workbench/.github/i18n-final/refine.py
          git add -A
          test "$(git write-tree)" = d88fda39e4898212757c74a755596cd02c3cc390
          cat > ../reviewed.commit <<'COMMIT'
          tree d88fda39e4898212757c74a755596cd02c3cc390
          parent 95d2b27289f3056bc1d754a3ad1bad8ccdfefd14
          author Kim Ma <141823112+MJYKIM99@users.noreply.github.com> 1790021792 +0000
          committer Kim Ma <141823112+MJYKIM99@users.noreply.github.com> 1790021792 +0000

          fix(i18n): validate native locale parsing and complete Traditional interface copy

          Disambiguate Foundation locale subtag handling in the tray and widget. Keep remaining ordinary Traditional labels localized. Await the observable edit-form state in browser regressions, keep fixture credentials out of snapshots, and capture new dialog and Usage views for review.
          COMMIT
          target=$(git hash-object -t commit -w ../reviewed.commit)
          test "$target" = e49195e1bd3327fb350106ea9eaf6da081f7c74a
          for parent in 54e8f702f089399df94f305c244abc9f8722c168 f0811d80c18a7d33324ce74d468a76ac6180c5d3 d795cb9bad4a6dbc08662b6608cadbcc8f312f00 70f9b2a096e5c19d502c088ec5c0247308c8372d; do
            git merge-base --is-ancestor "$parent" "$target"
          done
          git diff --exit-code 54e8f702f089399df94f305c244abc9f8722c168 "$target" -- .github package.json package-lock.json apps/control-center/package.json apps/control-center/package-lock.json
          git diff --check 54e8f702f089399df94f305c244abc9f8722c168 "$target"
          git push origin "$target:refs/heads/codex/chinese-i18n-candidate-v2"
          echo "sha=$target" >> "$GITHUB_OUTPUT"
          printf 'Candidate %s; tree %s\n' "$target" "$(git rev-parse "$target^{tree}")" >> "$GITHUB_STEP_SUMMARY"

  root:
    needs: publish-candidate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish-candidate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - run: npx playwright install chromium
        if: runner.os != 'Linux'
      - name: Root syntax and complete test suite
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm test 2>&1 | tee root-tests.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: root-${{ matrix.os }}
          path: root-tests.log
          retention-days: 7

  renderer:
    needs: publish-candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CODEX_ROUTER_UI_ARTIFACTS: ${{ github.workspace }}/ui-evidence
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish-candidate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/control-center/package-lock.json
      - run: npm ci
      - run: npm --prefix apps/control-center ci
      - run: npx playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - run: npx playwright install chromium
        if: runner.os != 'Linux'
      - name: Typecheck and compiled-renderer tests
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix apps/control-center run check
          npm --prefix apps/control-center test 2>&1 | tee renderer-tests.log
      - name: Build unpacked native application
        working-directory: apps/control-center
        run: npx --no-install electron-builder --${{ matrix.platform }} --dir
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: renderer-${{ matrix.os }}
          path: |
            renderer-tests.log
            ui-evidence/
          retention-days: 7

  native:
    needs: publish-candidate
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      MODEL_ROUTER_TRAY_UNIVERSAL: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish-candidate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Swift tray tests
        shell: bash
        run: |
          set -euo pipefail
          (cd apps/macos/ModelRouterTray && swift test) 2>&1 | tee swift-tests.log
      - name: Widget tests
        shell: bash
        run: |
          set -euo pipefail
          (cd apps/macos/RouterUsageWidget && xcodebuild -project RouterUsageWidget.xcodeproj -scheme RouterUsageWidget -destination 'platform=macOS' test CODE_SIGNING_ALLOWED=NO) 2>&1 | tee widget-tests.log
      - name: Universal unified application and bundle integrity
        shell: bash
        run: |
          set -euo pipefail
          scripts/build-macos-tray-app.sh "$RUNNER_TEMP/Codex Router.app" 2>&1 | tee native-build.log
          app="$RUNNER_TEMP/Codex Router.app"
          lipo "$app/Contents/MacOS/ModelRouterTray" -verify_arch x86_64 arm64
          lipo "$app/Contents/PlugIns/RouterUsageWidget.appex/Contents/MacOS/RouterUsageWidget" -verify_arch x86_64 arm64
          lipo "$app/Contents/Resources/Control Center.app/Contents/MacOS/Codex Router" -verify_arch x86_64 arm64
          codesign --verify --deep --strict "$app"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-macos
          path: |
            swift-tests.log
            widget-tests.log
            native-build.log
          retention-days: 7
