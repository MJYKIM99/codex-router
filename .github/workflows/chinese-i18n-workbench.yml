name: Chinese localization workbench

on:
  push:
    branches: [codex/chinese-i18n-validation]

permissions:
  contents: read

jobs:
  source-snapshot:
    if: github.repository == 'MJYKIM99/codex-router'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Prepare pinned public source snapshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/i18n-workbench"
          root="$RUNNER_TEMP/i18n-workbench"
          snapshot() {
            local name="$1" sha="$2"
            mkdir -p "$root/$name"
            curl --fail --silent --show-error --location --retry 2 \
              "https://codeload.github.com/duolahypercho/codex-router/tar.gz/$sha" \
              | tar -xz --strip-components=1 -C "$root/$name"
          }
          snapshot pr839 70f9b2a096e5c19d502c088ec5c0247308c8372d
          snapshot upstream 9c0db45676238d032757370ec4010b66b6759dd8
          snapshot zhTW d795cb9bad4a6dbc08662b6608cadbcc8f312f00
          snapshot usage 6417f44739bec5708be6d9bc2770c3c8c370285f
          snapshot custom e14bff0c6fe763746f5ef437382e3e3e108245c9
          snapshot base 5e1b49e6e3fea1ada57f0e7fa6ca7612e9d17300
          printf '%s\n' 'pr839=70f9b2a096e5c19d502c088ec5c0247308c8372d' 'upstream=9c0db45676238d032757370ec4010b66b6759dd8' 'zhTW=d795cb9bad4a6dbc08662b6608cadbcc8f312f00' 'usage=6417f44739bec5708be6d9bc2770c3c8c370285f' 'custom=e14bff0c6fe763746f5ef437382e3e3e108245c9' 'base=5e1b49e6e3fea1ada57f0e7fa6ca7612e9d17300' > "$root/refs.txt"
          cp "$(command -v node)" "$root/node24"
      - name: Install locked JavaScript dependencies in disposable checkout
        shell: bash
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/i18n-workbench/pr839"
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix apps/control-center --ignore-scripts --no-audit --no-fund
      - name: Archive only source snapshots and locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/chinese-i18n-workbench.tar.gz" -C "$RUNNER_TEMP" i18n-workbench
      - uses: actions/upload-artifact@v4
        with:
          name: chinese-i18n-workbench
          path: ${{ runner.temp }}/chinese-i18n-workbench.tar.gz
          retention-days: 1
          if-no-files-found: error
