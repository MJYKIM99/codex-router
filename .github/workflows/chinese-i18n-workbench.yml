name: Chinese localization workbench

on:
  push:
    branches: [codex/chinese-i18n-validation]

permissions:
  contents: read

concurrency:
  group: chinese-i18n-validation-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish-candidate:
    if: github.repository == 'MJYKIM99/codex-router'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: workbench
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: bbf034ed859a2f8ab662d541ee31d54ce403feab
          path: candidate
          fetch-depth: 0
      - name: Apply the independently tested English and Chinese copy correction
        run: python3 workbench/.github/i18n-workbench/fix_copy_contract.py candidate
      - name: Publish the exact verified tree to the candidate branch only
        id: publish
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          base=bbf034ed859a2f8ab662d541ee31d54ce403feab
          expected=e6ff72c27b1c5dba2e36626b89d8f44325c1313c
          branch=codex/chinese-i18n-candidate-v1
          test "$(git write-tree)" = "$expected"
          git diff --cached --check
          git config core.hooksPath /dev/null
          git config user.name 'Kim Ma'
          git config user.email '141823112+MJYKIM99@users.noreply.github.com'
          git fetch origin "$branch"
          current=$(git rev-parse FETCH_HEAD)
          if [ "$current" = "$base" ]; then
            git commit -m 'fix(i18n): preserve reasoning-control meaning and Chinese page headings' -m 'Keep the English Reasoning effort column rather than turning it into the Thinking activity state. Localize the Traditional Chinese Harness and Context headings and Simplified Chinese API-key labels. Add independent copy-contract assertions; retain existing browser expectations.'
            sha=$(git rev-parse HEAD)
            git push origin "$sha:refs/heads/$branch"
          else
            git merge-base --is-ancestor "$base" "$current"
            test "$(git rev-parse "$current^{tree}")" = "$expected"
            sha=$current
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          printf 'Validated candidate: %s; tree: %s\n' "$sha" "$expected" >> "$GITHUB_STEP_SUMMARY"

  root-tests:
    needs: publish-candidate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish-candidate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install browser for root panel E2E
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test

  control-center:
    needs: publish-candidate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish-candidate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - run: npm --prefix apps/control-center ci
      - run: npm --prefix apps/control-center run check
      - run: npm --prefix apps/control-center run build
      - name: Install renderer browser
        working-directory: apps/control-center
        run: npx playwright install --with-deps chromium
      - run: npm --prefix apps/control-center test

  native-macos:
    needs: publish-candidate
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish-candidate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - name: Native tray tests
        working-directory: apps/macos/ModelRouterTray
        run: swift test
      - name: Widget tests
        working-directory: apps/macos/RouterUsageWidget
        run: xcodebuild -project RouterUsageWidget.xcodeproj -scheme RouterUsageWidget -destination 'platform=macOS' test CODE_SIGNING_ALLOWED=NO
